name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  GO_VERSION: "1.22"

# 设置权限以允许写入releases
permissions:
  contents: write
  packages: write
  actions: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-
            ${{ runner.os }}-go-

      - name: Clean Go cache
        run: |
          go clean -cache -modcache -testcache
          go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted properly:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run tests
        run: |
          # 清理可能存在的测试文件
          find . -name "*.test" -delete 2>/dev/null || true
          find . -name "coverage.out" -delete 2>/dev/null || true
          
          # 设置Go测试环境变量以减少并发冲突
          export GOCACHE=$(go env GOCACHE)
          export GOMODCACHE=$(go env GOMODCACHE)
          
          # 运行测试，减少并发度以避免文件冲突
          go test -v -race -coverprofile=coverage.out -p=1 ./...
        env:
          CGO_ENABLED: 1
          GOMAXPROCS: 2

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Clean build directory
        run: |
          rm -rf build
          mkdir -p build

      - name: Build for Linux
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o build/data-migration-tool-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-w -s" -o build/data-migration-tool-linux-arm64 .

      - name: Build for Windows
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-w -s" -o build/data-migration-tool-windows-amd64.exe .

      - name: Build for macOS
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-w -s" -o build/data-migration-tool-darwin-amd64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-w -s" -o build/data-migration-tool-darwin-arm64 .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: build/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: build/

      - name: Create release archives
        run: |
          cd build
          # 清理可能存在的旧文件
          rm -f *.tar.gz *.zip
          
          # 设置文件权限
          chmod +x data-migration-tool-linux-* data-migration-tool-darwin-* 2>/dev/null || true
          
          # 创建压缩包
          tar -czf data-migration-tool-linux-amd64.tar.gz data-migration-tool-linux-amd64
          tar -czf data-migration-tool-linux-arm64.tar.gz data-migration-tool-linux-arm64
          zip data-migration-tool-windows-amd64.zip data-migration-tool-windows-amd64.exe
          tar -czf data-migration-tool-darwin-amd64.tar.gz data-migration-tool-darwin-amd64
          tar -czf data-migration-tool-darwin-arm64.tar.gz data-migration-tool-darwin-arm64
          
          # 验证文件创建
          ls -la *.tar.gz *.zip

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.tar.gz
            build/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
