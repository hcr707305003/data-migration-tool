version: "3.8"

services:
  data-migration-tool:
    build:
      context: .
      dockerfile: Dockerfile.cn
    container_name: data-migration-tool
    ports:
      - "8080:8080"
    # 使用init进程处理信号
    init: true
    # WSL环境下访问宿主机的配置
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "mysql-host:host-gateway"
      - "postgres-host:host-gateway"
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
      - MAX_CONCURRENT_TASKS=3
      - MAX_CONCURRENT_TABLES=2
      - MAX_CONCURRENT_BATCH=4
      - DEFAULT_BATCH_SIZE=1000
      - CONNECTION_TIMEOUT=30
      - QUERY_TIMEOUT=300
      - STATUS_CHECK_INTERVAL=300
      - TZ=Asia/Shanghai
      # WSL环境下的数据库连接示例
      - MYSQL_HOST=host.docker.internal
      - POSTGRES_HOST=host.docker.internal
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    restart: unless-stopped

networks:
  default:
    driver: bridge