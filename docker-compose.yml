version: "3.8"

services:
  data-migration-tool:
    build: .
    container_name: data-migration-tool
    ports:
      - "8780:8080"
    # 使用init进程处理信号
    init: true
    # 网络配置，允许访问宿主机服务
    network_mode: "host"
    # 或者使用extra_hosts（推荐）
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
      - MAX_CONCURRENT_TASKS=3
      - MAX_CONCURRENT_TABLES=2
      - MAX_CONCURRENT_BATCH=4
      - DEFAULT_BATCH_SIZE=1000
      - CONNECTION_TIMEOUT=30
      - QUERY_TIMEOUT=300
      - STATUS_CHECK_INTERVAL=300
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

networks:
  migration-network:
    driver: bridge
